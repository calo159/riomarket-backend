

services:
  - type: web
    name: riomarket
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      # Render genera y conserva estos valores automáticamente.
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Carga/actualiza el seed masivo y sus imágenes en cada arranque.
      # admin@riomarket.test / SEED_DEMO_PASSWORD (por defecto RioMarket2026!).
      - key: SEED_DEMO
        value: "true"
      # Demo: permite simular/autoaprobar pagos. Poner False con pasarela real.
      - key: PAYMENTS_SANDBOX_ENABLED
        value: "True"
      # Deben coincidir con lo que muestra el frontend (VITE_TARIFA_DOMICILIO).
      - key: DOMICILIO_TARIFA_BASE
        value: "3000.00"
      - key: PLATFORM_COMMISSION_PERCENTAGE
        value: "8.00"
      # Almacenamiento S3-compatible (opcional). Si no se configuran, usa disco local (efímero).
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_BUCKET_PUBLICO
        sync: false
      - key: STORAGE_S3_BUCKET_PRIVADO
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
