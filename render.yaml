databases:
  # Render crea la base automáticamente y la conecta al servicio.
  # Plan free: 1 GB y caduca a los 30 días (aviso por correo antes).
  - name: riomarket-db
    plan: free
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: riomarket
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      # Render genera y conserva estos valores automáticamente.
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: riomarket-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Crea los usuarios demo en el primer arranque (solo si la BD está vacía).
      # admin@riomarket.test / SEED_DEMO_PASSWORD (por defecto RioMarket2026!).
      - key: SEED_DEMO
        value: "True"
      # Demo: permite simular/autoaprobar pagos. Poner False con pasarela real.
      - key: PAYMENTS_SANDBOX_ENABLED
        value: "True"
