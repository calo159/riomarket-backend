services:
  - type: web
    name: riomarket
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.prod"
      - key: SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PAYMENTS_WEBHOOK_SECRET
        sync: false
      - key: PAYMENTS_SANDBOX_ENABLED
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
