# Fuente de verdad de la matriz de trazabilidad (ver docs/trazabilidad.md).
#
# Cada requisito se verifica con `python scripts/trazabilidad.py --check` (paso del CI):
#   - `pruebas` de pytest: `ruta.py`, `ruta.py::Clase` o `ruta.py::Clase::prueba` (también una
#     carpeta terminada en `/` o un patrón con `*`). Debe existir en `pytest --collect-only`.
#   - `pruebas` de Vitest/Playwright: `frontend/...::nombre` con el texto exacto del `it`/`test`.
#   - `endpoints`: `MÉTODO /ruta/` tal como sale del esquema OpenAPI generado (con `{id}`).
#   - `pantallas`: rutas de `frontend/src/App.tsx` (con `:id`).
#   - `evidencia`: archivos que respaldan un requisito que no se prueba solo con código.
#   - `pendiente: true`: el requisito se declara pero aún no está completo (no falla el check).
# Un RF necesita al menos una prueba; un RNF, una prueba o una evidencia.
# Al añadir una función al producto, añada o amplíe su requisito aquí y regenere la matriz.

