<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00626D" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · RioMarket</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Figtree Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #edf1f3;
        color: #1b2a33;
      }
      header { background: #00626d; padding: 14px 20px; }
      .marca { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: #ffffff; }
      .marca span { color: #ffd166; }
      main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
      .tarjeta {
        width: 100%;
        max-width: 440px;
        padding: 28px 24px;
        background: #ffffff;
        border: 1px solid #dde4e8;
        border-radius: 14px;
      }
      h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.2; font-weight: 800; }
      p { margin: 0 0 20px; font-size: 16px; line-height: 1.5; color: #34454e; }
      button {
        min-height: 48px;
        padding: 0 22px;
        font: inherit;
        font-weight: 700;
        color: #ffffff;
        background: #cf3f1b;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { background: #b53414; }
      button:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #f1f5f9; }
        header { background: #002c32; }
        .tarjeta { background: #0f172a; border-color: #1e293b; }
        p { color: #cbd5e1; }
      }
    </style>
  </head>
  <body>
    <header><span class="marca">Rio<span>Market</span></span></header>
    <main>
      <div class="tarjeta">
        <h1>Sin conexión</h1>
        <p>No pudimos llegar a RioMarket. Revisa tu conexión a internet y vuelve a intentarlo; tu carrito sigue guardado en este dispositivo.</p>
        <button type="button" id="reintentar">Reintentar</button>
      </div>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
