[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*", ".venv", "venv", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "UP",  # modernizaciones de Python
    "B",   # bugs conocidos (bugbear)
    "C4",  # comprehensions
    "SIM", # simplificaciones
    "DJ",  # reglas específicas de Django
    "RUF", # reglas ruff
]
ignore = [
    "DJ01",   # null=True vs blank=True se decide caso a caso
    "SIM108", # el ternario a veces es menos legible
    "B008",   # calls en defaults (patrón DRF: APIView.as_view())
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E402", "F403", "F405"]
# RUF012: en Django, Meta.ordering/constraints y permission_classes son
# clases o listas que Django espera como atributos de clase; el aviso de
# "mutable default" no aplica (no se mutan en runtime).
"apps/*/models.py" = ["RUF012"]
"apps/**/views.py" = ["RUF012"]
"apps/administration/serializers.py" = ["RUF012"]
"apps/administration/tests/*.py" = ["RUF012", "E501"]
"apps/accounts/verificacion_views.py" = ["RUF012"]
# Tablas de datos del seed: las tuplas largas se leen mejor en una línea.
"apps/demo/management/commands/seed_masivo.py" = ["E501"]
"apps/rbac/defaults.py" = ["E501"]
"apps/rbac/tests/*.py" = ["RUF012", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/admin.py"]

[tool.coverage.report]
# Umbral del CI (ADR-015): medido 94 % con ramas el 31/10/2026; 91 deja margen por ruido.
fail_under = 91
show_missing = true
skip_empty = true
