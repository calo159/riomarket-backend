name: Seguridad

# Busca vulnerabilidades conocidas en las dependencias. Corre en cada PR a main y una vez por
# semana: un aviso nuevo puede aparecer sin que cambie una línea. El análisis del código propio
# (CodeQL) ya lo hace la configuración predeterminada de GitHub (Ajustes → Code security).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vulnerabilidades en las dependencias de Python
        # Las versiones están fijadas en requirements.txt, así que se auditan tal cual.
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Vulnerabilidades en las dependencias del frontend
        # Solo lo que viaja a producción; las herramientas de desarrollo no llegan al usuario.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
