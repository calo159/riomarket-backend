name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riomarket
          POSTGRES_PASSWORD: riomarket
          POSTGRES_DB: riomarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riomarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://riomarket:riomarket@localhost:5432/riomarket
      # Las pruebas corren contra PostgreSQL (como producción), no contra SQLite en memoria.
      TEST_DATABASE_URL: postgres://riomarket:riomarket@localhost:5432/riomarket
      DEBUG: "False"
      PAYMENTS_SANDBOX_ENABLED: "True"
      SECRET_KEY: ci-secret-key-riomarket-0123456789abcdefghijklmnopqrstuvwxyz
      FERNET_KEY: 5yje5UOGK7sn3fg3xean97SK9QMXDRl-jS8LiAKULP8=

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check apps config tests scripts --no-cache
          ruff format --check apps config tests scripts

      - name: Migraciones sin cambios pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Suite de pruebas con umbral de cobertura
        # El umbral (fail_under) vive en pyproject.toml; la cobertura incluye ramas.
        run: pytest -q --cov=apps --cov-report=term-missing:skip-covered

      - name: Validar esquema OpenAPI
        run: python manage.py spectacular --file schema.yaml --validate

      - name: Matriz de trazabilidad al día
        run: python scripts/trazabilidad.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    # Recorridos por rol en un navegador real contra el sistema completo (ADR-016). Solo en PR y en
    # main: en cada push de una rama sin PR gastaría minutos sin que nadie lo revise.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riomarket
          POSTGRES_PASSWORD: riomarket
          POSTGRES_DB: riomarket_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riomarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Django sirve el frontend construido con la configuración de producción (WhiteNoise, CSP
      # y cabeceras reales). Sin HTTPS: se desactiva solo la redirección, las cookies siguen
      # siendo Secure y Chromium las acepta en 127.0.0.1.
      E2E_CI: "1"
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://riomarket:riomarket@localhost:5432/riomarket_e2e
      ALLOWED_HOSTS: 127.0.0.1,localhost
      SECURE_SSL_REDIRECT: "False"
      SECRET_KEY: ci-e2e-secret-key-riomarket-0123456789abcdefghijklmnopqrstuvwxyz
      FERNET_KEY: 5yje5UOGK7sn3fg3xean97SK9QMXDRl-jS8LiAKULP8=
      PAYMENTS_SANDBOX_ENABLED: "True"
      SEED_DEMO_PASSWORD: RioMarket2026!
      # Límites altos solo para este proceso: las pruebas inician sesión muchas veces seguidas.
      THROTTLE_ANON: 100000/min
      THROTTLE_USER: 100000/min
      THROTTLE_LOGIN: 100000/min
      THROTTLE_REGISTER: 100000/min
      THROTTLE_PAGOS: 100000/min

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Construir el frontend
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
          VITE_SANDBOX_PAGOS: "true"
          VITE_TARIFA_DOMICILIO: "3000"
        run: npm run build

      - name: Preparar la base (migraciones y datos de demostración)
        run: |
          python manage.py migrate --noinput
          python manage.py seed_masivo
          python manage.py seed_imagenes_demo
          # Igual que scripts/render-start.sh: libera lo vencido (el pedido [SM-31] nace vencido).
          python manage.py cancelar_pedidos_vencidos

      - name: Versión de Playwright
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        working-directory: frontend
        # Con la caché solo descarga lo que falte; --with-deps instala las bibliotecas del sistema.
        run: npx playwright install --with-deps chromium

      - name: Pruebas end-to-end
        working-directory: frontend
        # Playwright levanta el servidor de Django (ver playwright.config.ts). Un reintento por
        # prueba; las que lo necesiten quedan anotadas en el resumen del trabajo.
        run: npx playwright test

      - name: Subir trazas, capturas y vídeo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
