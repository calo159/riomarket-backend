name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riomarket
          POSTGRES_PASSWORD: riomarket
          POSTGRES_DB: riomarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riomarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://riomarket:riomarket@localhost:5432/riomarket
      DEBUG: "False"
      PAYMENTS_SANDBOX_ENABLED: "True"
      SECRET_KEY: ci-secret-key-riomarket-0123456789abcdefghijklmnopqrstuvwxyz
      FERNET_KEY: 5yje5UOGK7sn3fg3xean97SK9QMXDRl-jS8LiAKULP8=

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check apps config tests --no-cache
          ruff format --check apps config tests

      - name: Migraciones sin cambios pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Suite de pruebas
        run: pytest -q

      - name: Validar esquema OpenAPI
        run: python manage.py spectacular --file schema.yaml --validate