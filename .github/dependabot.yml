# Actualizaciones de dependencias abiertas como PR: el CI las prueba y tú decides si fusionar.
# Los parches y menores van agrupados (un PR por ecosistema y semana) para no inundar la lista;
# los cambios mayores llegan sueltos porque pueden romper cosas.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      frontend-menores:
        update-types: [minor, patch]
    ignore:
      # La 0.5 exige ESLint 9 y el proyecto sigue en ESLint 8: con ella npm no resuelve el árbol.
      # Se retoma al migrar a ESLint 9.
      - dependency-name: eslint-plugin-react-refresh
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
